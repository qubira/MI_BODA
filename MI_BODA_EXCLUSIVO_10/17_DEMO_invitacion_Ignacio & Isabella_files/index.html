      color: #000000;
      opacity: 0.6;

    @media (max-width: 768px) {

      }

 <body class="h-full">
  <div class="countdown-container">
   <div class="time-unit">
    <div class="number" id="days" style="font-size: 330.467px; font-family: YAFdJhem5V8, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif; color: rgb(0, 0, 0);">000</div>
    <div class="label" id="days-label" style="font-size: 49.57px; font-family: YAFdJhem5V8, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif; color: rgb(0, 0, 0);">DÍAS</div>
   </div>
   <div class="time-unit">
    <div class="number" id="hours" style="font-size: 330.467px; font-family: YAFdJhem5V8, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif; color: rgb(0, 0, 0);">00</div>
    <div class="label" id="hours-label" style="font-size: 49.57px; font-family: YAFdJhem5V8, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif; color: rgb(0, 0, 0);">HORAS</div>
   </div>
   <div class="time-unit">
    <div class="number" id="minutes" style="font-size: 330.467px; font-family: YAFdJhem5V8, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif; color: rgb(0, 0, 0);">00</div>
    <div class="label" id="minutes-label" style="font-size: 49.57px; font-family: YAFdJhem5V8, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif; color: rgb(0, 0, 0);">MINUTOS</div>
   </div>
  </div>
  <script>
    const defaultConfig = {
      background_color: "#ffffff",
      text_color: "#000000",
      font_family: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif",
      font_size: 72,
      days_label: "DÍAS",
      hours_label: "HORAS",
      minutes_label: "MINUTOS"
    };

    let config = { ...defaultConfig };

    const targetDate = new Date('2026-06-20T13:00:00-04:00').getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const distance = targetDate - now;

      if (distance < 0) {
        document.getElementById('days').textContent = '000';
        document.getElementById('hours').textContent = '00';
        document.getElementById('minutes').textContent = '00';
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));

      document.getElementById('days').textContent = String(days).padStart(2, '0');
      document.getElementById('hours').textContent = String(hours).padStart(2, '0');
      document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
    }

    async function onConfigChange(newConfig) {
      config = { ...config, ...newConfig };
      
      const baseFontSize = config.font_size || defaultConfig.font_size;
      const fontFamily = config.font_family || defaultConfig.font_family;
      const textColor = config.text_color || defaultConfig.text_color;
      
      const numberElements = document.querySelectorAll('.number');
      const labelElements = document.querySelectorAll('.label');
      
      numberElements.forEach(el => {
        el.style.fontSize = `${baseFontSize}px`;
        el.style.fontFamily = `${fontFamily}, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif`;
        el.style.color = textColor;
      });
      
      labelElements.forEach(el => {
        el.style.fontSize = `${baseFontSize * 0.15}px`;
        el.style.fontFamily = `${fontFamily}, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif`;
        el.style.color = textColor;
      });

      document.getElementById('days-label').textContent = config.days_label || defaultConfig.days_label;
      document.getElementById('hours-label').textContent = config.hours_label || defaultConfig.hours_label;
      document.getElementById('minutes-label').textContent = config.minutes_label || defaultConfig.minutes_label;
    }

    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange,
        mapToCapabilities: (config) => ({
          recolorables: [
            {
              get: () => config.text_color || defaultConfig.text_color,
              set: (value) => {
                config.text_color = value;
                window.elementSdk.setConfig({ text_color: value });
              }
            }
          ],
          borderables: [],
          fontEditable: {
            get: () => config.font_family || defaultConfig.font_family,
            set: (value) => {
              config.font_family = value;
              window.elementSdk.setConfig({ font_family: value });
            }
          },
          fontSizeable: {
            get: () => config.font_size || defaultConfig.font_size,
            set: (value) => {
              config.font_size = value;
              window.elementSdk.setConfig({ font_size: value });
            }
          }
        }),
        mapToEditPanelValues: (config) => new Map([
          ["days_label", config.days_label || defaultConfig.days_label],
          ["hours_label", config.hours_label || defaultConfig.hours_label],
          ["minutes_label", config.minutes_label || defaultConfig.minutes_label]
        ])
      });
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
